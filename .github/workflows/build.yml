name: Bygg APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Uses the zip uploaded most recently, whatever the phone named it.
      - name: Packa upp projektet
        run: |
          latest="$(git log --diff-filter=AM --name-only --pretty=format: -- '*.zip' | grep -m1 . || true)"
          if [ -n "$latest" ]; then
            echo "Bygger från: $latest"
            rm -rf Podbacken
            unzip -o -q "$latest"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Bygg appen
        run: |
          if [ -d Podbacken ]; then cd Podbacken; fi
          gradle assembleDebug --no-daemon
          cp "$(find . -name app-debug.apk | head -1)" "$GITHUB_WORKSPACE/Podbacken.apk"

      - name: Lägg ut APK-filen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Podbacken ${{ github.run_number }}
          files: Podbacken.apk
          make_latest: true
